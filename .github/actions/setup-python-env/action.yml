name: Setup Python Environment
description: Set up Python with pip caching, optionally installing project dependencies

inputs:
  python-version:
    description: Version of Python to Setup Environment With
    required: true

  install-deps:
    description: Whether to install dependencies from requirements.txt
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt